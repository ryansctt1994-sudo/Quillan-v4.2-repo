name: Quillan Evidence

on:
  pull_request:
    paths:
      - "Quillan-v4.2-model/quillan_council_enhanced.py"
      - "eval/**"
      - "evidence/**"
      - ".github/workflows/quillan-evidence.yml"
  push:
    branches:
      - "research/architecture-claims-framework"
    paths:
      - "Quillan-v4.2-model/quillan_council_enhanced.py"
      - "eval/**"
      - "evidence/**"
      - ".github/workflows/quillan-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-evidence:
    name: structural-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "jsonschema==4.23.0"

      - name: Validate non-evidentiary schema example
        run: python evidence/validate_receipt.py evidence/examples/receipt-example.json

      - name: Run claim-linked structural evidence
        run: python evidence/run_structural_evidence.py

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quillan-structural-evidence-${{ github.sha }}
          path: |
            evidence/runs/QRUN-000001/
            evidence/receipts/Q-MODEL-001/QRUN-000001.json
          if-no-files-found: error
