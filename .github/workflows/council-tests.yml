name: Council tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  council:
    name: quillan_council_enhanced tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and pytest
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install pytest
      - run: python -m pytest -q testing/test_council_enhanced.py
