name: Quillan Runtime

on:
  push:
    branches: [main]
    paths:
      - "quillan_runtime/**"
      - ".github/workflows/quillan-runtime.yml"
  pull_request:
    paths:
      - "quillan_runtime/**"
      - ".github/workflows/quillan-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quillan_runtime/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "quillan_runtime[dev]"

      - name: Static checks
        run: |
          python -m compileall -q quillan_runtime/src
          python -m ruff check quillan_runtime

      - name: Tests
        run: python -m pytest quillan_runtime/tests
