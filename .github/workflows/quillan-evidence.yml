name: Quillan Evidence

on:
  pull_request:
    paths:
      - "Quillan-v4.2-model/quillan_council_enhanced.py"
      - "eval/**"
      - "evidence/**"
      - ".github/workflows/quillan-evidence.yml"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CLAIMS.yaml"
      - "LIMITATIONS.md"
      - "REPOSITORY_LAYOUT.md"
  push:
    branches:
      - "research/architecture-claims-framework"
    paths:
      - "Quillan-v4.2-model/quillan_council_enhanced.py"
      - "eval/**"
      - "evidence/**"
      - ".github/workflows/quillan-evidence.yml"
      - "README.md"
      - "ARCHITECTURE.md"
      - "CLAIMS.yaml"
      - "LIMITATIONS.md"
      - "REPOSITORY_LAYOUT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-evidence:
    name: structural-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile evidence harness
        run: |
          python -m py_compile evidence/validate_receipt.py
          python -m py_compile evidence/run_structural_evidence.py
          python -m py_compile eval/structural/test_enhanced_council.py

      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema==4.23.0"
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Validate non-evidentiary schema example
        run: python evidence/validate_receipt.py evidence/examples/receipt-example.json

      - name: Run claim-linked structural evidence
        run: python evidence/run_structural_evidence.py

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quillan-structural-evidence-${{ github.sha }}
          path: |
            evidence/runs/QRUN-000003/
            evidence/receipts/bundles/QRUN-000003.json
          if-no-files-found: error
